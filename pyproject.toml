[project]
name = "langchain-hello"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ali Moslemi", email = "gitlab_admin_f15eb4@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "black>=26.10.1",
    "httpx[socks]>=0.28.1",
    "ipykernel",
    "isort>=9.0.2",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "langchain-openrouter",
    "langsmith>=0.14.17",
    "numpy",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-hello = "langchain_hello:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
